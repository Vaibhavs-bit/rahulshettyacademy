# Application under test.
base.url=https://rahulshettyacademy.com/client/#/dashboard/dash

# Browser: chrome | firefox | edge. Can be overridden with -Dbrowser=<name>
browser=chrome

# Headless execution. Can be overridden with -Dheadless=true|false
headless=false

# Timeouts (seconds)
explicit.wait.seconds=15
page.load.timeout.seconds=30

# Evidence and reporting toggles
screenshot.enabled=true
report.enabled=true
log.level=INFO

# Parallel execution toggle (actual parallel mode/thread-count is configured in testng.xml)
parallel.enabled=false

# Output locations (relative to project root)
output.directory=test-output
report.directory=reports
